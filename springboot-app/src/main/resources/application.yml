# Replaces the COBOL ODBC connection string from sql/sql_example.cbl (lines 36-43):
#   'DRIVER={PostgreSQL Unicode};SERVER=localhost;PORT=5432;
#    DATABASE=cobol_db_example;UID=postgres;PWD=password;'
spring:
  application:
    name: cobol-migration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cobol_db_example}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
