<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COBOL Migration - Account Manager</title>
    <style>
        body { font-family: monospace; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #0f0; }
        h1 { color: #0ff; border-bottom: 2px solid #0ff; padding-bottom: 10px; }
        h2 { color: #0ff; }
        .menu { background: #16213e; padding: 20px; border: 1px solid #0ff; margin: 20px 0; }
        .menu a { display: block; color: #0f0; text-decoration: none; padding: 8px 0; cursor: pointer; }
        .menu a:hover { color: #0ff; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #0ff; padding: 6px 10px; text-align: left; }
        th { background: #16213e; color: #0ff; }
        input, button { font-family: monospace; background: #16213e; color: #0f0; border: 1px solid #0ff; padding: 8px 12px; margin: 4px; }
        button:hover { background: #0a3d62; cursor: pointer; }
        #results { margin-top: 20px; white-space: pre-wrap; }
        .error { color: #f00; }
        .header-line { color: #0ff; }
    </style>
</head>
<body>
    <h1>COBOL SQL DB Example Program (Spring Boot)</h1>
    <p class="header-line">----------------------------</p>

    <div class="menu">
        <p>Menu:</p>
        <a onclick="loadAllAccounts()">1) Display all accounts</a>
        <a onclick="loadDisabledAccounts()">2) Display disabled accounts</a>
        <a onclick="showSearch()">3) Query accounts</a>
        <a onclick="showSystemInfo()">4) System Info</a>
    </div>

    <div id="search-box" style="display:none; margin: 10px 0;">
        <label>Enter search value: </label>
        <input type="text" id="search-input" placeholder="Search...">
        <button onclick="searchAccounts()">Search</button>
    </div>

    <div id="results"></div>

    <script>
        const API = '/api';

        async function loadAllAccounts() {
            try {
                const res = await fetch(`${API}/accounts`);
                const accounts = await res.json();
                displayAccounts(accounts, 'ACCOUNTS:');
            } catch (e) { showError(e); }
        }

        async function loadDisabledAccounts() {
            try {
                const res = await fetch(`${API}/accounts?enabled=N`);
                const accounts = await res.json();
                displayAccounts(accounts, 'DISABLED ACCOUNTS:');
            } catch (e) { showError(e); }
        }

        function showSearch() {
            document.getElementById('search-box').style.display = 'block';
            document.getElementById('search-input').focus();
        }

        async function searchAccounts() {
            const q = document.getElementById('search-input').value;
            try {
                const res = await fetch(`${API}/accounts/search?q=${encodeURIComponent(q)}`);
                const accounts = await res.json();
                displayAccounts(accounts, `SEARCH RESULTS FOR "${q}":`);
            } catch (e) { showError(e); }
        }

        function displayAccounts(accounts, title) {
            let html = `<h2>${title}</h2><table>`;
            html += '<tr><th>ID</th><th>First</th><th>Last</th><th>Phone</th><th>Address</th><th>Enabled</th></tr>';
            accounts.forEach(a => {
                html += `<tr><td>${a.id}</td><td>${a.firstName}</td><td>${a.lastName}</td>` +
                        `<td>${a.phone}</td><td>${a.address}</td><td>${a.isEnabled}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('results').innerHTML = html;
        }

        async function showSystemInfo() {
            try {
                const [dateRes, timeRes, userRes] = await Promise.all([
                    fetch(`${API}/system/date`), fetch(`${API}/system/time`), fetch(`${API}/system/user`)
                ]);
                const [dateInfo, timeInfo, userInfo] = await Promise.all([dateRes.json(), timeRes.json(), userRes.json()]);
                let html = '<h2>SYSTEM INFO:</h2><table>';
                html += '<tr><th>Property</th><th>Value</th></tr>';
                Object.entries({...dateInfo, ...timeInfo, ...userInfo}).forEach(([k, v]) => {
                    html += `<tr><td>${k}</td><td>${v}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('results').innerHTML = html;
            } catch (e) { showError(e); }
        }

        function showError(e) {
            document.getElementById('results').innerHTML = `<p class="error">Error: ${e.message}</p>`;
        }
    </script>
</body>
</html>
