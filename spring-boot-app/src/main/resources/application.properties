# =============================================================================
# PostgreSQL Connection Configuration
# Mirrors the connection string from sql/sql_example.cbl:
#   DRIVER={PostgreSQL Unicode};SERVER=localhost;PORT=5432;
#   DATABASE=cobol_db_example;UID=postgres;PWD=password;
# =============================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/cobol_db_example
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Initialize schema from schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Server configuration
server.port=8080
