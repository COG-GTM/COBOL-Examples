# PostgreSQL connection configuration
# Maps from the COBOL connection string in sql/sql_example.cbl lines 35-42:
#   DRIVER={PostgreSQL Unicode};SERVER=localhost;PORT=5432;
#   DATABASE=cobol_db_example;UID=postgres;PWD=password;
spring.datasource.url=jdbc:postgresql://localhost:5432/cobol_db_example
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Initialize schema from migration scripts
spring.sql.init.mode=never
