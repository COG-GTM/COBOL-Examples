spring:
  application:
    name: cobol-to-java-migration

  # PostgreSQL configuration matching COBOL sql/sql_example.cbl connection
  # COBOL connection: SERVER=localhost; PORT=5432; DATABASE=cobol_db_example; UID=postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobol_db_example}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Spring Batch configuration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # Flyway database migration
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
