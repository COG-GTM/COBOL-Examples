spring:
  application:
    name: cobol-migration

  # PostgreSQL datasource configuration
  # Matches the COBOL ODBC connection string from sql/sql_example.cbl:
  #   DRIVER={PostgreSQL Unicode};SERVER=localhost;PORT=5432;
  #   DATABASE=cobol_db_example;UID=postgres;PWD=password;
  datasource:
    url: jdbc:postgresql://localhost:5432/cobol_db_example
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway database migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring Batch configuration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

# Logging configuration
logging:
  level:
    root: INFO
    com.cobolmigration: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: WARN
